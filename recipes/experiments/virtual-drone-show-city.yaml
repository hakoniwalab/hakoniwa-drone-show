# See docs/virtual-drone-show-city-config.md for every field.
version: 1

experiment:
  id: drone-fleet-single-host-mujoco-city-2

scale:
  drone_count: 200
  process_count: 8

runtime:
  mode: native
  visualization: true
  show_runner_real_time_sync: true

global_wind:
  enabled: true
  initial_mode: manual
  manual:
    enabled: false
    speed_m_s: 0.0
    direction_to_deg: 0.0
    speed_stddev_m_s: 0.0
  live:
    provider: open-meteo
    poll_interval_sec: 300
    timeout_sec: 5
    stale_after_sec: 900

environment:
  mode: plateau
  plateau:
    city_world_receipt: ../../../hakoniwa-business-pack/work/remote-operation/city-world-worker/jobs/osaka-27100-lat34.687-lon135.526/build/world/city-world-receipt.json
    altitude_mode: route-clearance
  flat:
    ground_height_m: 5.479387621660862
    origin:
      latitude: 35.0988
      longitude: 138.8587
      altitude_offset_m: 2.7360082114794118

viewer:
  network:
    host: 192.168.11.47
  initial_mode: audience
  led_appearance:
    scale: 1.0
    intensity: 1.0
    spatial_depth_cue: true
  city_lighting:
    enabled: true
    brightness: 1.0
    lights:
      light1:
        enabled: true
        position_m: [0.0, -30.0, 8.0]
        target_m: [0.0, 0.0, 20.0]
        brightness: 1.0
        spread_deg: 35.0
        color: "#ffd6a0"
      light2:
        enabled: true
        position_m: [30.0, 0.0, 8.0]
        target_m: [0.0, 0.0, 20.0]
        brightness: 0.7
        spread_deg: 35.0
        color: "#ffd6a0"
      light3:
        enabled: true
        position_m: [0.0, 30.0, 8.0]
        target_m: [0.0, 0.0, 20.0]
        brightness: 0.45
        spread_deg: 35.0
        color: "#ffd6a0"
      light4:
        enabled: true
        position_m: [-30.0, 0.0, 8.0]
        target_m: [0.0, 0.0, 20.0]
        brightness: 0.7
        spread_deg: 35.0
        color: "#ffd6a0"
  crowd:
    enabled: true
    count: 240
    center_m: [0.0, -34.0]
    width_m: 44.0
    depth_m: 16.0
    ground_height_m: 33.0
    lighting:
      enabled: true
      intensity: 140.0
      height_m: 4.0
  audience_camera:
    position_m: [11.66, -44.91, 33.76]
    yaw_deg: 105.56
    pitch_deg: 12.08
    fov_deg: 67.02

ar:
  enabled: false
  venue:
    latitude: 35.0988
    longitude: 138.8587
    heading_deg: 0.0
  preview:
    location_source: override
    override:
      latitude: 35.0985305
      longitude: 138.8587
    eye_height_m: 1.6
    movement_speed_m_s: 5.0
    device_orientation: optional

scenario:
  show_file: ../../shows/kids-space-adventure.show.json
  launch_area:
    mode: manual
    offset_m: [-50.0, 0.0, 0.0]
  formation:
    scale_m: 20
    depth_m: 10.0
    audience_tilt_deg: -60.0
  altitude_m: 10.0
  max_speed_m_s: 20.0
  timeout_sec: 120.0
  land: false

results:
  enabled: false
  directory: results
