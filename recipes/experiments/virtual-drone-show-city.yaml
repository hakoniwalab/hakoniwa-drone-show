# See docs/virtual-drone-show-city-config.md for every field.
version: 1

experiment:
  id: drone-fleet-single-host-mujoco-city-2

scale:
  drone_count: 180
  process_count: 8

runtime:
  mode: native
  visualization: true
  show_runner_real_time_sync: true

viewer:
  initial_mode: audience
  led_appearance:
    scale: 1.45
    intensity: 1.25
  audience_camera:
    position_m: [0.0, -30.0, 6.0]
    yaw_deg: 90.0
    pitch_deg: 15.0
    fov_deg: 55.0

scenario:
  show_file: ../../shows/kids-space-adventure.show.json
  formation:
    scale_m: 20
    audience_tilt_deg: -60.0
  altitude_m: 10.0
  max_speed_m_s: 20.0
  timeout_sec: 120.0
  land: false

results:
  enabled: false
  directory: results
