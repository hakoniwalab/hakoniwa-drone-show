<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakoniwa Virtual Drone Show</title>
  <script src="https://cdn.jsdelivr.net/npm/proj4@2.9.2/dist/proj4.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <link rel="stylesheet" href="./drone-show.css">
</head>
<body class="night-mode">
  <main id="layout">
    <aside id="show-panel">
      <p class="eyebrow">HAKONIWA</p>
      <h1>Virtual Drone Show</h1>
      <div class="status-card">
        <span id="show-state" data-state="connecting">接続中</span>
        <p id="show-detail">起動しています</p>
      </div>
      <button id="show-start" type="button" disabled>ドローンショー開始</button>
      <section id="camera-panel" aria-label="カメラ視点">
        <p class="camera-label">カメラ視点</p>
        <div class="camera-buttons">
          <button id="camera-audience" type="button" aria-pressed="false">観客視点</button>
          <button id="camera-free" type="button" aria-pressed="false">自由視点</button>
        </div>
        <p id="camera-help" hidden>矢印: 前後左右 / U・D: 上下 / Shift: 高速<br>左ドラッグ: 横向き / 右ドラッグ: 仰角 / ホイール: 画角</p>
        <div id="camera-state" hidden>
          <p class="camera-coordinate-label">現在値（ENU）</p>
          <dl class="camera-values">
            <div><dt>X / East</dt><dd><span id="camera-x">0.00</span> m</dd></div>
            <div><dt>Y / North</dt><dd><span id="camera-y">0.00</span> m</dd></div>
            <div><dt>Z / Up</dt><dd><span id="camera-z">0.00</span> m</dd></div>
            <div><dt>Yaw</dt><dd><span id="camera-yaw">0.00</span>°</dd></div>
            <div><dt>Pitch</dt><dd><span id="camera-pitch">0.00</span>°</dd></div>
            <div><dt>FOV</dt><dd><span id="camera-fov">0.00</span>°</dd></div>
          </dl>
          <button id="camera-copy" type="button">YAML設定をコピー</button>
          <p id="camera-copy-status" role="status" aria-live="polite"></p>
        </div>
      </section>
      <dl>
        <div><dt>表示中の機体</dt><dd id="drone-count">0 / 0</dd></div>
        <div><dt>通信</dt><dd>WebSocket :8765</dd></div>
      </dl>
      <p class="hint">すべての機体が表示され、開始待ちになるとボタンが有効になります。</p>
      <section id="map-panel" aria-label="機体位置マップ">
        <p class="map-label">機体位置</p>
        <div id="map"></div>
      </section>
    </aside>
    <section id="viewer-area">
      <div id="three-root"></div>
    </section>
  </main>
  <script type="module" src="./drone-show-app.mjs"></script>
</body>
</html>
