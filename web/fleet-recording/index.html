<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hakoniwa Fleet Recording</title>
  <link rel="stylesheet" href="./recording.css">
  <script async src="https://unpkg.com/es-module-shims@1.6.3/dist/es-module-shims.js"></script>
  <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
  </script>
</head>
<body>
  <main id="three-root"></main>
  <aside id="recording-panel">
    <h1>Hakoniwa Fleet Recording</h1>
    <p id="state" data-state="connecting">Connecting</p>
    <p id="detail">Initializing viewer</p>
    <p id="fleet-count">Fleet visible 0/0</p>
    <section id="experiment-conditions" aria-label="Experiment conditions">
      <h2>Experiment conditions</h2>
      <dl>
        <div><dt>Dynamics</dt><dd id="condition-physics">—</dd></div>
        <div><dt>Fleet</dt><dd id="condition-fleet">—</dd></div>
        <div><dt>Processes</dt><dd id="condition-processes">—</dd></div>
        <div><dt>Formation</dt><dd id="condition-formation">—</dd></div>
        <div><dt>Clock</dt><dd id="condition-clock">—</dd></div>
      </dl>
    </section>
    <button id="show-start" type="button" disabled>Start show</button>
  </aside>
  <script type="module" src="./recording-app.mjs"></script>
</body>
</html>
